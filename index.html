<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 阻止搜尋引擎索引與檢索此網頁 -->
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>無向運動有限公司 | 專業體育運動裝備</title>

    <link rel="stylesheet" href="assets/main.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>
<body>

    <div id="app">
        <header>
            <div class="container header-inner">
                <div class="logo">
                    <a href="#">
                        <img src="assets/img/logo/logo_img.png" alt="無向運動 Logo" class="logo-icon">
                        <img src="assets/img/logo/logo_txt.png" alt="無向運動" class="logo-text">
                    </a>
                </div>

                <!-- Desktop Navigation -->
                <nav>
                    <a href="#" 
                       v-for="cat in navCategories" 
                       :key="cat"
                       :class="{ active: selectedCategory === cat }"
                       @click.prevent="filterCategory(cat)">
                       {{ cat }}
                    </a>
                </nav>

                <div class="header-actions">
                    <!-- Hamburger Button -->
                    <div class="hbg" :class="{ 'is-active': isMenuOpen }" @click="toggleMenu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Mobile Navigation Menu -->
        <div class="mobile-nav" :class="{ 'is-open': isMenuOpen }">
            <a href="#" 
               v-for="cat in navCategories" 
               :key="'mobile-' + cat"
               :class="{ active: selectedCategory === cat }"
               @click.prevent="filterCategory(cat); isMenuOpen = false">
               {{ cat }}
            </a>
        </div>

        <article id="products">
            <div class="container">

                <!-- Dynamic Product Grid -->
                <div class="product-grid">
                    <div class="product-card" v-for="product in filteredProducts" :key="product.id">
                        <div class="product-img">
                            <span class="tag" v-if="product.tag">{{ product.tag }}</span>
                            <img :src="product.image" :alt="product.name" loading="lazy" @error="handleImageError">
                        </div>

                        <div class="product-info">
                            <span class="category">{{ product.category }}</span>
                            <h3>{{ product.name }}</h3>
                            <div class="price-row">
                                <span class="price">NT$ {{ product.price.toLocaleString() }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </article>

        <footer>
            <div class="container footer-inner">
                <div class="footer-title">歡迎聯繫無向運動</div>
                
                <div class="social">
                    <a href="#" title="Facebook">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                    </a>
                    <a href="#" title="Instagram">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </a>
                    <a href="#" title="LINE">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.82 2 10.5c0 2.93 1.8 5.53 4.58 7.07l-.67 2.45c-.08.28.18.53.45.43l2.87-1.12c.88.24 1.81.37 2.77.37 5.52 0 10-3.82 10-8.5S17.52 2 12 2z"></path></svg>
                    </a>
                </div>

                <div class="contact-info">
                    <p><span>公司名稱 ｜</span> 無向運動有限公司</p>
                    <p><span>官方 Line ｜</span> @wuxiangsports</p>
                    <p><span>服務項目 ｜</span> 團隊球衣客製 / 體育器材批發 / 運動服飾</p>
                </div>

                <div class="copyright">
                    &copy; 2026 無向運動有限公司. All rights reserved.
                </div>
            </div>
        </footer>
    </div>

    <script src="assets/main.js"></script>
</body>
</html>
